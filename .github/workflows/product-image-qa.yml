name: Product asset quality
on:
  pull_request:
    paths:
      - 'assets/products/**'
      - 'scripts/check_product_assets.py'
      - '.github/workflows/product-image-qa.yml'
  workflow_dispatch:
jobs:
  inspect-product-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python -m pip install Pillow
      - name: Inspect the 15 featured WebP assets
        run: python scripts/check_product_assets.py
