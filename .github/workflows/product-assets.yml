name: Validate garment image transparency
on:
  pull_request:
    paths:
      - 'assets/products/**'
      - 'scripts/validate-product-assets.mjs'
      - '.github/workflows/product-assets.yml'
  workflow_dispatch:
jobs:
  product-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify transparent WebP garment assets
        run: node scripts/validate-product-assets.mjs
